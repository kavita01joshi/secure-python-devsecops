- name: Build Docker image
  run: |
    docker build -t secure-python-devsecops:${{ github.sha }} .

- name: Scan Docker image with Trivy
  uses: aquasecurity/trivy-action@master
  with:
    image-ref: secure-python-devsecops:${{ github.sha }}
    format: table
    exit-code: '1'
    ignore-unfixed: true
    severity: HIGH,CRITICAL
